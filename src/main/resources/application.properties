# ============================================
# Aplicación
# ============================================
quarkus.application.name=mis-finanzas-api
# El puerto lo inyecta el host (Railway usa la variable PORT).
# En local sin esa variable, cae a 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# ============================================
# CORS — orígenes por variable de entorno
# ============================================
# En dev: localhost. En prod: la URL del frontend en Vercel.
quarkus.http.cors=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
# Para que la web lea el nombre del archivo al exportar CSV
quarkus.http.cors.exposed-headers=Content-Disposition

# ============================================
# Límites HTTP (MITIGACIÓN MF-08)
# ============================================
# 1M: una importación de hasta 1000 filas de estado de cuenta
quarkus.http.limits.max-body-size=1M
quarkus.http.limits.max-form-attribute-size=2K
quarkus.http.limits.max-header-size=8K
quarkus.http.read-timeout=30s

# ============================================
# Base de datos
# ============================================
# En local: valores por defecto del docker-compose.
# En prod: Railway inyecta las variables de la base PostgreSQL.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:finanzas}
quarkus.datasource.password=${DB_PASSWORD:finanzas}
# La URL se define por perfil: en test no hay URL y Dev Services levanta un
# PostgreSQL desechable en Docker (ver perfil TEST).
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/misfinanzas}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/misfinanzas}
%pentest.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/misfinanzas}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

# ============================================
# Hibernate ORM
# ============================================
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ============================================
# Flyway — corre las migraciones al arrancar
# ============================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration

# ============================================
# JWT
# ============================================
# En local: archivos .pem en el classpath/raíz.
# En prod: el CONTENIDO de las llaves viene en variables de entorno
#          (ver perfil %prod más abajo y DEPLOY.md).
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://mis-finanzas.suarez.pe}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
app.jwt.duration-seconds=${JWT_DURATION_SECONDS:28800}

# ============================================
# Health check
# ============================================
quarkus.smallrye-health.root-path=/q/health

# ============================================
# Cache (MITIGACIÓN MF-03 — denylist de tokens revocados)
# ============================================
quarkus.cache.caffeine."revoked-tokens".initial-capacity=128
quarkus.cache.caffeine."revoked-tokens".maximum-size=10000
quarkus.cache.caffeine."revoked-tokens".expire-after-write=9H

# ============================================
# Rate limiting (MITIGACIÓN MF-01)
# ============================================
app.security.rate-limit.ip.capacity=${RATE_LIMIT_IP_CAPACITY:10}
app.security.rate-limit.ip.window-minutes=${RATE_LIMIT_IP_WINDOW:15}
app.security.rate-limit.email.capacity=${RATE_LIMIT_EMAIL_CAPACITY:5}
app.security.rate-limit.email.window-minutes=${RATE_LIMIT_EMAIL_WINDOW:15}

# ============================================
# OpenAPI / Swagger UI
# ============================================
quarkus.smallrye-openapi.info-title=Mis Finanzas API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para el control de finanzas personales

# ============================================
# Logging
# ============================================
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%X{requestId}] [%c{2.}] (%t) %s%e%n
quarkus.log.category."pe.suarez.finanzas".level=INFO

# ============================================
# Perfil DEV
# ============================================
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
%dev.quarkus.log.category."pe.suarez.finanzas".level=DEBUG
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.swagger-ui.path=/q/swagger-ui
# Rate limit relajado en dev para no bloquearte durante el desarrollo
%dev.app.security.rate-limit.ip.capacity=500
%dev.app.security.rate-limit.ip.window-minutes=1
%dev.app.security.rate-limit.email.capacity=200
%dev.app.security.rate-limit.email.window-minutes=1

# ============================================
# Perfil TEST
# ============================================
# Sin URL → Quarkus Dev Services levanta un PostgreSQL desechable en Docker.
# Así los tests nunca tocan tu base local y corren con las migraciones reales.
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
# Puerto libre al azar para no chocar con otros procesos locales
%test.quarkus.http.test-port=0
%test.app.security.rate-limit.ip.capacity=500
%test.app.security.rate-limit.ip.window-minutes=1
%test.app.security.rate-limit.email.capacity=200
%test.app.security.rate-limit.email.window-minutes=1

# ============================================
# Perfil PENTEST — para validación de mitigaciones
# ============================================
%pentest.app.security.rate-limit.ip.capacity=200
%pentest.app.security.rate-limit.ip.window-minutes=1
%pentest.app.security.rate-limit.email.capacity=100
%pentest.app.security.rate-limit.email.window-minutes=1

# ============================================
# Perfil PROD
# ============================================
# Swagger DESACTIVADO en producción (MITIGACIÓN MF-07)
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.smallrye-openapi.enable=false
# SQL logging siempre apagado en prod
%prod.quarkus.hibernate-orm.log.sql=false
# Railway Free + Serverless: backend y Postgres se duermen tras ~5-10 min sin
# tráfico saliente. Cualquier conexión abierta (y su validación periódica)
# cuenta como tráfico, así que el pool no conserva conexiones inactivas.
%prod.quarkus.datasource.jdbc.min-size=0
%prod.quarkus.datasource.jdbc.initial-size=0
%prod.quarkus.datasource.jdbc.max-size=4
%prod.quarkus.datasource.jdbc.idle-removal-interval=1M
%prod.quarkus.log.category."pe.suarez.finanzas".level=INFO
# Las llaves JWT en prod se leen desde el contenido de variables de entorno.
# Railway monta el contenido en estos paths vía el startup (ver DEPLOY.md).
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}

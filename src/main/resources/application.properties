# ============================================
# Aplicación
# ============================================
quarkus.application.name=mis-finanzas-api
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# ============================================
# Límites HTTP (MITIGACIÓN MF-08)
# ============================================
# Body máximo: 256 KB. Cualquier petición legítima cabe holgadamente
# (DTO más grande de la app es ~2KB). Bodies mayores se rechazan con 413.
quarkus.http.limits.max-body-size=256K
quarkus.http.limits.max-form-attribute-size=2K
quarkus.http.limits.max-header-size=8K
# Timeout de read de body para evitar slow-loris
quarkus.http.read-timeout=30s

# ============================================
# Base de datos
# ============================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:finanzas}
quarkus.datasource.password=${DB_PASSWORD:finanzas}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/misfinanzas}
quarkus.datasource.jdbc.max-size=16

# ============================================
# Hibernate ORM
# ============================================
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ============================================
# Flyway
# ============================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration

# ============================================
# JWT
# ============================================
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://mis-finanzas.suarez.pe}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
app.jwt.duration-seconds=28800

# ============================================
# Cache (MITIGACIÓN MF-03 — denylist de tokens revocados)
# ============================================
quarkus.cache.caffeine."revoked-tokens".initial-capacity=128
quarkus.cache.caffeine."revoked-tokens".maximum-size=10000
# Las entradas viven 9h (1h más que el JWT) para asegurar que tokens revocados
# permanezcan en cache hasta que naturalmente expiren.
quarkus.cache.caffeine."revoked-tokens".expire-after-write=9H

# ============================================
# Rate limiting (MITIGACIÓN MF-01)
# ============================================
# IP-based: 10 intentos / 15 minutos
app.security.rate-limit.ip.capacity=10
app.security.rate-limit.ip.window-minutes=15
# Email-based: 5 intentos fallidos consecutivos / 15 minutos
app.security.rate-limit.email.capacity=5
app.security.rate-limit.email.window-minutes=15

# ============================================
# OpenAPI / Swagger UI
# ============================================
quarkus.smallrye-openapi.info-title=Mis Finanzas API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para el control de finanzas personales
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ============================================
# Logging
# ============================================
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%X{requestId}] [%c{2.}] (%t) %s%e%n
quarkus.log.category."pe.suarez.finanzas".level=INFO

# ============================================
# Perfil DEV
# ============================================
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
%dev.quarkus.log.category."pe.suarez.finanzas".level=DEBUG
%dev.app.security.rate-limit.ip.capacity=500
%dev.app.security.rate-limit.ip.window-minutes=1
%dev.app.security.rate-limit.email.capacity=200
%dev.app.security.rate-limit.email.window-minutes=1

# ============================================
# Perfil TEST
# ============================================
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

# ============================================
# Perfil PENTEST — solo para validación de mitigaciones
# Eleva los límites de rate limit para que las pruebas puedan
# completar suficientes requests sin ser bloqueadas POR la prueba.
# El rate limit en sí se sigue probando con T-01 que lo agota a propósito.
# ============================================
%pentest.app.security.rate-limit.ip.capacity=200
%pentest.app.security.rate-limit.ip.window-minutes=1
%pentest.app.security.rate-limit.email.capacity=100
%pentest.app.security.rate-limit.email.window-minutes=1
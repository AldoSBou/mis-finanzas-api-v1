services:
  postgres:
    image: postgres:16-alpine
    container_name: misfinanzas-db
    environment:
      POSTGRES_DB: misfinanzas
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas
    ports:
      - "5432:5432"
    volumes:
      - misfinanzas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d misfinanzas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  misfinanzas_data:
